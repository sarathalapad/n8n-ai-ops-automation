# Local stack: n8n + Postgres + Ollama + the OpsGuard helper service.
# Copy .env.example to .env and replace every placeholder before starting.
# Only n8n (and optionally the helper) are published, and only on 127.0.0.1.
name: n8n-ai-ops

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: n8n
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10-ops.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Encrypts stored credentials. Losing it means re-entering every credential.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      # Plain-http localhost only. Set to true (and use TLS) anywhere else.
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      # The workflows read the URLs below via $env; nothing secret is exposed this way.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      GENERIC_TIMEZONE: ${TZ:-UTC}
      TZ: ${TZ:-UTC}
      OPSGUARD_BASE_URL: http://opsguard:8000
      N8N_INTERNAL_BASE_URL: http://localhost:5678
      OPS_CHAT_WEBHOOK_URL: ${OPS_CHAT_WEBHOOK_URL:?set OPS_CHAT_WEBHOOK_URL in .env}
      RUNBOOK_API_URL: ${RUNBOOK_API_URL:?set RUNBOOK_API_URL in .env}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
      opsguard:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    # Not published: only n8n talks to the model, over the compose network.
    volumes:
      - ollama_data:/root/.ollama

  opsguard:
    build:
      context: .
      dockerfile: service/Dockerfile
    restart: unless-stopped
    environment:
      OPSGUARD_API_TOKEN: ${OPSGUARD_API_TOKEN:?set OPSGUARD_API_TOKEN in .env}
      OPSGUARD_APPROVERS: ${OPSGUARD_APPROVERS:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - audit_data:/data

volumes:
  pgdata:
  n8n_data:
  ollama_data:
  audit_data:
