[project]
name = "n8n-ai-ops-automation"
version = "0.1.0"
description = "AI-powered IT operations automation with n8n and a governance helper service"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sarathkumar K" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["service", "scripts"]
filterwarnings = ["ignore:.*httpx2.*"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["opsguard", "validate_workflows"]
